# Portable installation templates for Amap/rail; no real credentials.
# NOT a snapshot of the user's active deployment. Current agent orchestration:
# config/mcp-routing.toml (also includes hosted Didi and RollingGo hotel).
# runtime.py mcp-config resolves native launch paths for the current machine.
# Never replace your entire private Codex config with this file.

[amap_http]
# Official hosted transport. No Node/npm install or local map process.
# Credential is inserted only into the private Codex config after live checks.
url = "https://mcp.amap.com/mcp"

[mcp_servers.travel_amap]
command = "npx"
args = ["-y", "@amap/amap-maps-mcp-server@0.0.8"]
env_vars = ["AMAP_MAPS_API_KEY"]
startup_timeout_sec = 45
tool_timeout_sec = 60
enabled_tools = [
  "maps_geo",
  "maps_regeocode",
  "maps_text_search",
  "maps_around_search",
  "maps_search_detail",
  "maps_direction_driving",
  "maps_direction_walking",
  "maps_direction_transit_integrated",
  "maps_distance",
  "maps_weather",
]

# Community server, NOT an official China Railway MCP.
# Startup accesses railway websites before the MCP handshake.
# Enable only after testing successfully on your own network.
[mcp_servers.travel_rail]
command = "npx"
args = ["-y", "12306-mcp@0.3.10"]
startup_timeout_sec = 60
tool_timeout_sec = 60
enabled = false
enabled_tools = [
  "get-current-date",
  "get-stations-code-in-city",
  "get-station-code-of-citys",
  "get-station-code-by-names",
  "get-station-by-telecode",
  "get-tickets",
  "get-interline-tickets",
  "get-train-route-stations",
]
